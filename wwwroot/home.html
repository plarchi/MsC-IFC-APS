<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Models List</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
  <link rel="stylesheet" href="/main.css">
  <style>
    body, html { height: 100%; margin: 0; }
    #container { display: flex; height: 100%; }
    #left { flex: 0 0 50%; min-width: 280px; padding: 12px 32px 12px 12px; box-sizing: border-box; overflow-y: auto; position: relative; }
    #splitter {
      flex: 0 0 10px;
      cursor: col-resize;
      position: relative;
      background: transparent;
      user-select: none;
      touch-action: none;
    }
    #splitter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: #ddd;
      transform: translateX(-50%);
    }
    #splitter:hover::before,
    #splitter.is-dragging::before { background: #999; }
    #right { flex: 1 1 auto; min-width: 320px; background: transparent; padding: 12px 12px 12px 32px; box-sizing: border-box; overflow-y: auto; }
    .right-top-actions { display: flex; align-items: center; justify-content: center; margin: 12px 0 0; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #444; }
    .top-actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 12px; }
    .nav-btn { display: inline-flex; align-items: center; justify-content: center; width: 50%; box-sizing: border-box; padding: 10px 20px; border: 1px solid #ddd; background: transparent; border-radius: 5px; cursor: pointer; text-decoration: none; color: #000; font-weight: 700; text-transform: uppercase; line-height: 1; flex: 0 0 auto; }
    .etl-btn { color: darkblue; }
    ol { margin: 0; padding-left: 24px; }
    li { margin: 8px 0; display: flex; align-items: center; gap: 12px; position: relative; padding-right: calc(10px + 200px); }
    #modelList a { text-decoration: none; color: #444; flex: 1 1 auto; }
    #modelList a:hover { text-decoration: underline; }
    #revisedModelList a { text-decoration: none; color: #444; flex: 1 1 auto; }
    #revisedModelList a:hover { text-decoration: underline; }
    .row-actions { position: absolute; right: 0px; top: 50%; transform: translateY(-50%); display: inline-flex; gap: 8px; }
    .row-actions button { padding: 5px 10px; border: 1px solid #ddd; background: transparent; border-radius: 5px; cursor: pointer; }
    .delete-btn { color: darkred; }
    .download-btn { color: darkblue; }
    #comparisonPanel { margin-top: 18px; }
    #comparisonTitle { font-size: 16px; margin: 0 0 8px; color: #444; text-align: left; }
    #comparisonSummary { margin: 0 0 8px; color: #444; font-weight: 700; text-align: left; }
    #comparisonContent { text-align: left; color: #444; }
    #comparisonTable { width: 100%; border-collapse: collapse; }
    #comparisonTable th, #comparisonTable td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    #comparisonTable th { background: #f8f8f8; }
  </style>
</head>
<body>
  <div id="container">
    <div id="left">
      <div class="top-actions">
        <a class="nav-btn" href="/index.html">3D Home</a>
      </div>
      <h1>Model List</h1>
      <ol id="modelList">
        <!-- Filled by home.js -->
      </ol>
    </div>
    <div id="splitter" aria-label="Resize panels" role="separator"></div>
    <div id="right">
      <div class="right-top-actions">
        <button type="button" class="nav-btn etl-btn">Model after ETL</button>
      </div>
      <h1>Model List</h1>
      <ol id="revisedModelList">
        <!-- Filled by home.js -->
      </ol>
      <div id="comparisonPanel">
        <h2 id="comparisonTitle">Comparison Table</h2>
        <p id="comparisonSummary"></p>
        <div id="comparisonContent">Select a revised model to view comparison data.</div>
      </div>
    </div>
  </div>
  <script src="/home.js?v=9" type="module"></script>
</body>
</html>
