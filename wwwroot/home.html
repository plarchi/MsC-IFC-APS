<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Models List</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
  <link rel="stylesheet" href="/main.css">
  <style>
    body, html { height: 100%; margin: 0; }
    #container { display: flex; height: 100%; }
    #left { width: 50%; padding: 12px 32px 12px 12px; box-sizing: border-box; overflow-y: auto; position: relative; }
    #right { width: 50%; border-left: 1px solid #ddd; background: transparent; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #444; }
    .top-actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 12px; }
    .nav-btn { display: inline-flex; align-items: center; justify-content: center; width: 50%; box-sizing: border-box; padding: 10px 20px; border: 1px solid #ddd; background: transparent; border-radius: 5px; cursor: pointer; text-decoration: none; color: #000; font-weight: 700; text-transform: uppercase; line-height: 1; flex: 0 0 auto; }
    ol { margin: 0; padding-left: 24px; }
    li { margin: 8px 0; display: flex; align-items: center; gap: 12px; position: relative; padding-right: calc(10px + 96px); }
    #modelList a { text-decoration: none; color: #444; flex: 1 1 auto; }
    #modelList a:hover { text-decoration: underline; }
    .delete-btn { position: absolute; right: 0px; top: 50%; transform: translateY(-50%); padding: 5px 10px; border: 1px solid #ddd; background: transparent; color: darkred; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="container">
    <div id="left">
      <div class="top-actions">
        <a class="nav-btn" href="/index.html">Home</a>
      </div>
      <h1>Model List</h1>
      <ol id="modelList">
        <!-- Filled by home.js -->
      </ol>
    </div>
    <div id="right">
      <!-- Empty right half for now -->
    </div>
  </div>
  <script src="/home.js?v=4" type="module"></script>
</body>
</html>
